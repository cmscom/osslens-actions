[project]
name = "osslens-actions"
version = "0.1.0"
description = "OSS license audit tool on your projects"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "CMScom" }
]
license = { file = "LICENSE" }
keywords = ["license", "oss", "audit", "compliance", "dependency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "packaging>=23.0",
    "langchain-core>=1.0.7",
    "langgraph>=0.2.0",
    "jinja2>=3.1.6",
    "langchain-openai>=1.0.3",
    "langchain-anthropic>=1.1.0",
    "sqlalchemy>=2.0.44",
    "httpx>=0.27.0",
    "license-expression>=30.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
oss-license-scan = "oss_license_scan.cli.main:app"
